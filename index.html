<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <meta name="description" content="An interactive SHSID course catalog: build a four-year plan, see prerequisites and move-ups checked in real time, and share it as a link.">
    <meta property="og:title" content="SHSID Interactive Course Catalog">
    <meta property="og:description" content="Build and share a four-year SHSID course plan with live prerequisite checking.">
    <meta property="og:type" content="website">
    <title>SHSID Interactive Course Catalog</title>
    <script>
      // Paint the saved theme before the app mounts, so a dark-mode user never gets
      // a white flash on load.
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem('shsid-cc.prefs.v1') || 'null');
          var dark = saved && typeof saved.darkMode === 'boolean'
            ? saved.darkMode
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) { /* defaults are fine */ }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>This course planner needs JavaScript enabled to run.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
