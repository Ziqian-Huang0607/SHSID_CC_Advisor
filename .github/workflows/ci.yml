# CI
#
# Runs on every push and pull request: type-check, production build, and the
# API smoke suite against an in-process harness. Nothing here touches a
# deployment or a real rating store — the suite runs the handler with its
# in-memory fallback, so it is safe to run on any branch.

name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm run build` runs vue-tsc and the Vite production build.
      - name: Type-check and build
        run: npm run build

      # Node 22 gates TypeScript type stripping behind a flag; the harness needs
      # it to import the API handler without a build step.
      - name: API smoke tests
        run: node --experimental-strip-types scripts/api-smoke.mjs
